<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Крестики-Нолики</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    --board-dark: #16291f;
    --board-green: #1f3b2c;
    --board-green-light: #274a37;
    --chalk: #f3efe4;
    --chalk-dim: #cfd6c9;
    --chalk-yellow: #e8c468;
    --chalk-blue: #8ec9e8;
    --chalk-coral: #e8897f;
    --frame: #3a2a1e;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: 'Nunito', sans-serif;
    background: radial-gradient(ellipse at top, var(--board-green-light), var(--board-dark) 75%);
    color: var(--chalk);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .frame {
    width: 100%;
    max-width: 420px;
    border: 10px solid var(--frame);
    border-radius: 14px;
    background: var(--board-green);
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.45),
      0 20px 50px rgba(0,0,0,0.5);
    padding: 28px 22px 24px;
    position: relative;
  }

  h1 {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 44px;
    text-align: center;
    margin: 0 0 4px;
    color: var(--chalk);
    text-shadow: 0 0 10px rgba(243,239,228,0.25);
    letter-spacing: 0.5px;
  }

  .subtitle {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 13px;
    margin-bottom: 20px;
    letter-spacing: 0.3px;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* --- Mode select --- */
  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 8px;
  }
  .mode-card {
    background: rgba(243,239,228,0.06);
    border: 1.5px dashed rgba(243,239,228,0.35);
    border-radius: 10px;
    padding: 16px 8px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .mode-card.wide { grid-column: 1 / -1; }
  .mode-card:active { transform: scale(0.97); }
  .mode-card:hover { background: rgba(243,239,228,0.1); }
  .mode-card .icon { font-size: 28px; margin-bottom: 6px; display: block; }
  .mode-card .label { font-weight: 800; font-size: 14.5px; }
  .mode-card .hint { font-size: 11px; color: var(--chalk-dim); margin-top: 3px; }

  /* --- Buttons / inputs --- */
  .btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    margin-top: 10px;
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--chalk-yellow); color: #2a2110; }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-ghost {
    background: transparent;
    color: var(--chalk-dim);
    border: 1.5px solid rgba(243,239,228,0.3);
  }
  .btn-ghost:hover { color: var(--chalk); border-color: var(--chalk); }

  input.code-input {
    width: 100%;
    text-align: center;
    letter-spacing: 6px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 22px;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px dashed rgba(243,239,228,0.4);
    background: rgba(0,0,0,0.2);
    color: var(--chalk);
    text-transform: uppercase;
  }
  input.code-input::placeholder { color: rgba(243,239,228,0.3); letter-spacing: 3px; }
  input.code-input:focus { outline: none; border-color: var(--chalk-yellow); }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    color: var(--chalk-dim);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .options-sub { display: none; margin-top: 16px; }
  .options-sub.active { display: block; }
  .divider {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 12px;
    margin: 16px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(243,239,228,0.2);
  }

  .room-code-display {
    text-align: center;
    font-family: 'Caveat', cursive;
    font-size: 52px;
    letter-spacing: 8px;
    color: var(--chalk-yellow);
    margin: 6px 0 2px;
  }
  .waiting-text {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 13.5px;
  }
  .dots::after {
    content: '';
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }

  /* --- Difficulty chips --- */
  .chip-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .chip {
    flex: 1;
    text-align: center;
    padding: 9px 6px;
    border-radius: 20px;
    border: 1.5px solid rgba(243,239,228,0.3);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: var(--chalk-dim);
  }
  .chip.selected {
    border-color: var(--chalk-yellow);
    color: var(--chalk-yellow);
    background: rgba(232,196,104,0.1);
  }

  /* --- Game screen --- */
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    min-height: 24px;
  }
  .status-text { font-size: 14.5px; font-weight: 700; }
  .status-text.win { color: var(--chalk-yellow); }
  .players-tag { font-size: 12px; color: var(--chalk-dim); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 0;
    width: 100%;
    aspect-ratio: 1 / 1;
    position: relative;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
  }
  /* chalky grid lines via borders on inner cells */
  .cell:nth-child(1), .cell:nth-child(2), .cell:nth-child(3) { border-bottom: 2.5px dashed rgba(243,239,228,0.4); }
  .cell:nth-child(7), .cell:nth-child(8), .cell:nth-child(9) { border-top: none; }
  .cell:nth-child(4), .cell:nth-child(5), .cell:nth-child(6) { border-bottom: 2.5px dashed rgba(243,239,228,0.4); border-top: 2.5px dashed rgba(243,239,228,0.4); }
  .cell:nth-child(1), .cell:nth-child(4), .cell:nth-child(7) { border-right: 2.5px dashed rgba(243,239,228,0.4); }
  .cell:nth-child(3), .cell:nth-child(6), .cell:nth-child(9) { border-left: none; }
  .cell:nth-child(2), .cell:nth-child(5), .cell:nth-child(8) { border-right: 2.5px dashed rgba(243,239,228,0.4); border-left: 2.5px dashed rgba(243,239,228,0.4); }

  .cell svg { width: 58%; height: 58%; overflow: visible; }
  .cell.win-cell { background: rgba(232,196,104,0.12); border-radius: 6px; }

  .mark-path {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 9;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: draw 0.35s ease forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .game-footer {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .game-footer .btn { margin-top: 0; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="frame">
  <h1>Крестики-Нолики</h1>
  <div class="subtitle" id="subtitle">выбери, с кем играешь</div>

  <!-- ЭКРАН 1: выбор режима -->
  <div class="screen active" id="screen-menu">
    <div class="mode-grid">
      <div class="mode-card" id="mode-bot">
        <span class="icon">🤖</span>
        <div class="label">Против бота</div>
        <div class="hint">играй один</div>
      </div>
      <div class="mode-card" id="mode-random">
        <span class="icon">🌐</span>
        <div class="label">Случайный игрок</div>
        <div class="hint">найдём тебе соперника</div>
      </div>
      <div class="mode-card wide" id="mode-friend">
        <span class="icon">🧑‍🤝‍🧑</span>
        <div class="label">С другом по коду</div>
        <div class="hint">создай комнату или введи код</div>
      </div>
    </div>

    <div id="bot-options" class="options-sub">
      <div class="chip-row">
        <div class="chip selected" data-level="easy">Полегче</div>
        <div class="chip" data-level="hard">Сложно</div>
      </div>
      <button class="btn btn-primary" id="start-bot-game">Начать игру</button>
    </div>

    <div id="friend-options" class="options-sub">
      <button class="btn btn-primary" id="create-room-btn">Создать комнату</button>
      <div class="divider">или</div>
      <input class="code-input" id="join-code-input" maxlength="4" placeholder="КОД" />
      <button class="btn btn-ghost" id="join-room-btn">Войти по коду</button>
    </div>

    <div id="random-options" class="options-sub">
      <button class="btn btn-primary" id="start-random-btn">Найти соперника</button>
    </div>

    <div class="back-link hidden" id="back-to-modes">← назад к выбору режима</div>
  </div>

  <!-- ЭКРАН 2: ожидание соперника -->
  <div class="screen" id="screen-waiting">
    <div id="waiting-code-block">
      <p class="waiting-text">Код твоей комнаты:</p>
      <div class="room-code-display" id="room-code-text">----</div>
      <button class="btn btn-ghost" id="copy-code-btn">Скопировать код</button>
    </div>
    <p class="waiting-text" id="waiting-main-text" style="margin-top:18px;">Отправь код другу и жди<span class="dots"></span></p>
    <div class="back-link" id="cancel-waiting">← отменить</div>
  </div>

  <!-- ЭКРАН 3: игра -->
  <div class="screen" id="screen-game">
    <div class="status-row">
      <div class="status-text" id="status-text">Ход: X</div>
      <div class="players-tag" id="players-tag"></div>
    </div>
    <div class="board" id="board"></div>
    <div class="game-footer">
      <button class="btn btn-ghost" id="menu-btn">В меню</button>
      <button class="btn btn-primary hidden" id="rematch-btn">Ещё раз</button>
    </div>
  </div>
</div>

<script>
(function () {
  // ---------- Telegram integration ----------
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // ---------- State ----------
  let mode = null;            // 'bot' | 'friend' | 'random'
  let board = Array(9).fill(null);
  let turn = 'X';
  let mySymbol = 'X';         // for online modes, assigned by server
  let botLevel = 'easy';
  let gameOver = false;
  let socket = null;
  let roomCode = null;

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6],
  ];

  // ---------- DOM ----------
  const screens = {
    menu: document.getElementById('screen-menu'),
    waiting: document.getElementById('screen-waiting'),
    game: document.getElementById('screen-game'),
  };
  const subtitle = document.getElementById('subtitle');
  const boardEl = document.getElementById('board');
  const statusText = document.getElementById('status-text');
  const playersTag = document.getElementById('players-tag');
  const rematchBtn = document.getElementById('rematch-btn');
  const backToModes = document.getElementById('back-to-modes');
  const botOptions = document.getElementById('bot-options');
  const friendOptions = document.getElementById('friend-options');
  const randomOptions = document.getElementById('random-options');
  const waitingCodeBlock = document.getElementById('waiting-code-block');
  const waitingMainText = document.getElementById('waiting-main-text');

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  function resetMenuSubscreens() {
    botOptions.classList.remove('active');
    friendOptions.classList.remove('active');
    randomOptions.classList.remove('active');
    backToModes.classList.add('hidden');
    subtitle.textContent = 'выбери, с кем играешь';
  }

  // ---------- Mode selection ----------
  document.getElementById('mode-bot').addEventListener('click', () => {
    botOptions.classList.add('active');
    friendOptions.classList.remove('active');
    randomOptions.classList.remove('active');
    backToModes.classList.remove('hidden');
    subtitle.textContent = 'настрой игру против бота';
  });

  document.getElementById('mode-friend').addEventListener('click', () => {
    friendOptions.classList.add('active');
    botOptions.classList.remove('active');
    randomOptions.classList.remove('active');
    backToModes.classList.remove('hidden');
    subtitle.textContent = 'создай комнату или войди по коду';
  });

  document.getElementById('mode-random').addEventListener('click', () => {
    randomOptions.classList.add('active');
    botOptions.classList.remove('active');
    friendOptions.classList.remove('active');
    backToModes.classList.remove('hidden');
    subtitle.textContent = 'сыграй с тем, кто сейчас онлайн';
  });

  backToModes.addEventListener('click', resetMenuSubscreens);

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      botLevel = chip.dataset.level;
    });
  });

  // ---------- Bot mode ----------
  document.getElementById('start-bot-game').addEventListener('click', () => {
    mode = 'bot';
    mySymbol = 'X';
    board = Array(9).fill(null);
    turn = 'X';
    gameOver = false;
    playersTag.textContent = 'ты: X · бот: O';
    renderBoard();
    updateStatus();
    rematchBtn.classList.add('hidden');
    showScreen('game');
  });

  function botMove() {
    if (gameOver) return;
    let idx;
    if (botLevel === 'easy' && Math.random() < 0.6) {
      const empties = board.map((v,i) => v ? null : i).filter(v => v !== null);
      idx = empties[Math.floor(Math.random() * empties.length)];
    } else {
      idx = bestMove(board, 'O');
    }
    if (idx === undefined || idx === null) return;
    applyMove(idx, 'O');
  }

  function bestMove(b, player) {
    let bestScore = -Infinity, move = null;
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = player;
        const score = minimax(b, 0, false);
        b[i] = null;
        if (score > bestScore) { bestScore = score; move = i; }
      }
    }
    return move;
  }

  function minimax(b, depth, isMax) {
    const result = evaluate(b);
    if (result !== null) {
      if (result === 'O') return 10 - depth;
      if (result === 'X') return depth - 10;
      return 0;
    }
    if (isMax) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) { b[i] = 'O'; best = Math.max(best, minimax(b, depth+1, false)); b[i] = null; }
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) { b[i] = 'X'; best = Math.min(best, minimax(b, depth+1, true)); b[i] = null; }
      }
      return best;
    }
  }

  function evaluate(b) {
    for (const [a,c,d] of WIN_LINES) {
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
    }
    if (b.every(v => v)) return 'draw';
    return null;
  }

  // ---------- Online modes (Socket.io) ----------
  function ensureSocket() {
    if (socket) return socket;
    socket = io();

    socket.on('room-created', ({ code }) => {
      roomCode = code;
      waitingCodeBlock.classList.remove('hidden');
      document.getElementById('room-code-text').textContent = code;
      waitingMainText.textContent = 'Отправь код другу и жди';
      showScreen('waiting');
    });

    socket.on('waiting-random', () => {
      waitingCodeBlock.classList.add('hidden');
      waitingMainText.textContent = 'Ищем соперника';
      waitingMainText.classList.add('dots');
      showScreen('waiting');
    });

    socket.on('join-error', (msg) => {
      alert(msg);
    });

    socket.on('game-start', (data) => {
      mode = mode || 'friend';
      board = data.board;
      turn = data.turn;
      if (!data.keepSymbol && data.symbol) mySymbol = data.symbol;
      gameOver = false;
      playersTag.textContent = `ты: ${mySymbol}`;
      renderBoard();
      updateStatus();
      rematchBtn.classList.add('hidden');
      showScreen('game');
    });

    socket.on('move-made', ({ board: b, turn: t, result }) => {
      board = b;
      turn = t;
      renderBoard();
      if (result) {
        gameOver = true;
        showResult(result);
      } else {
        updateStatus();
      }
    });

    socket.on('opponent-left', () => {
      if (screens.game.classList.contains('active') || screens.waiting.classList.contains('active')) {
        alert('Соперник покинул игру.');
        goToMenu();
      }
    });

    return socket;
  }

  document.getElementById('create-room-btn').addEventListener('click', () => {
    mode = 'friend';
    ensureSocket().emit('create-room');
  });

  document.getElementById('join-room-btn').addEventListener('click', () => {
    const code = document.getElementById('join-code-input').value.trim();
    if (!code) return;
    mode = 'friend';
    ensureSocket().emit('join-room', code);
  });

  document.getElementById('start-random-btn').addEventListener('click', () => {
    mode = 'random';
    ensureSocket().emit('find-random');
  });

  document.getElementById('copy-code-btn').addEventListener('click', () => {
    if (roomCode) {
      navigator.clipboard.writeText(roomCode).catch(() => {});
      const btn = document.getElementById('copy-code-btn');
      const old = btn.textContent;
      btn.textContent = 'Скопировано!';
      setTimeout(() => btn.textContent = old, 1200);
    }
  });

  document.getElementById('cancel-waiting').addEventListener('click', () => {
    if (socket) {
      socket.emit('cancel-random');
      socket.disconnect();
    }
    socket = null;
    waitingMainText.classList.remove('dots');
    goToMenu();
  });

  rematchBtn.addEventListener('click', () => {
    if ((mode === 'friend' || mode === 'random') && socket) {
      socket.emit('rematch');
    } else {
      board = Array(9).fill(null);
      turn = 'X';
      gameOver = false;
      renderBoard();
      updateStatus();
      rematchBtn.classList.add('hidden');
    }
  });

  document.getElementById('menu-btn').addEventListener('click', () => {
    if (socket) { socket.disconnect(); socket = null; }
    goToMenu();
  });

  function goToMenu() {
    mode = null;
    board = Array(9).fill(null);
    gameOver = false;
    resetMenuSubscreens();
    showScreen('menu');
  }

  // ---------- Board rendering ----------
  function renderBoard() {
    boardEl.innerHTML = '';
    board.forEach((val, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      if (val) cell.appendChild(markSVG(val));
      cell.addEventListener('click', () => onCellClick(i));
      boardEl.appendChild(cell);
    });
  }

  function markSVG(symbol) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    if (symbol === 'X') {
      svg.innerHTML = `
        <path class="mark-path" d="M18,18 L82,82" style="stroke:var(--chalk-blue)"/>
        <path class="mark-path" d="M82,18 L18,82" style="stroke:var(--chalk-blue)"/>
      `;
    } else {
      svg.innerHTML = `<circle class="mark-path" cx="50" cy="50" r="34" style="stroke:var(--chalk-coral)"/>`;
    }
    return svg;
  }

  function onCellClick(i) {
    if (gameOver || board[i]) return;
    if (mode === 'bot') {
      if (turn !== 'X') return;
      applyMove(i, 'X');
      if (!gameOver) setTimeout(botMove, 350);
    } else if (mode === 'friend' || mode === 'random') {
      if (turn !== mySymbol) return;
      socket.emit('make-move', i);
    }
  }

  function applyMove(i, symbol) {
    board[i] = symbol;
    renderBoard();
    const result = evaluateFull(board);
    if (result) {
      gameOver = true;
      showResult(result);
    } else {
      turn = symbol === 'X' ? 'O' : 'X';
      updateStatus();
    }
  }

  function evaluateFull(b) {
    for (const line of WIN_LINES) {
      const [a,c,d] = line;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line };
    }
    if (b.every(v => v)) return { winner: 'draw', line: null };
    return null;
  }

  function updateStatus() {
    statusText.classList.remove('win');
    if (mode === 'bot') {
      statusText.textContent = turn === 'X' ? 'Твой ход' : 'Ход бота…';
    } else {
      statusText.textContent = turn === mySymbol ? 'Твой ход' : 'Ход соперника…';
    }
  }

  function showResult(result) {
    statusText.classList.add('win');
    if (result.winner === 'draw') {
      statusText.textContent = 'Ничья!';
    } else if (mode === 'bot') {
      statusText.textContent = result.winner === 'X' ? 'Ты победил! 🎉' : 'Победил бот';
    } else {
      statusText.textContent = result.winner === mySymbol ? 'Ты победил! 🎉' : 'Соперник победил';
    }
    if (result.line) {
      result.line.forEach(i => {
        boardEl.children[i].classList.add('win-cell');
      });
    }
    rematchBtn.classList.remove('hidden');
  }
})();
</script>
</body>
</html>
